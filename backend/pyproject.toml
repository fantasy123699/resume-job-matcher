[project]
name = "resume-job-matcher"
version = "0.1.0"
description = "Evidence-grounded resume and job matching backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.14,<2.0",
  "beautifulsoup4>=4.12,<5.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "pydantic-settings>=2.0,<3.0",
  "pymupdf>=1.26,<2.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "python-docx>=1.2,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0"
]

[dependency-groups]
dev = [
  "mypy>=1.14,<2.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.9,<1.0"
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_job_matcher"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/resume_job_matcher/api/**/*.py" = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "../apps/api", "../apps/worker"]

[[tool.mypy.overrides]]
module = ["fitz"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
